plugins
{
    id 'checkstyle'
    id 'java-library'
    id 'com.diffplug.spotless' version '8.10.0'
}

version = '0.4.0'
group   = 'io.github.borschtoverflow'

java
{
    toolchain
    {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }

    withSourcesJar()
    withJavadocJar()
}


javadoc
{
    final int currentYear = Year.now().value
    final String licenseURL = "https://github.com/BorschtOverflow/CoffeeCrypt/blob/master/LICENSE.md"
    final String footer = "Copyright &copy; ${currentYear} The CoffeeCrypt Authors, licensed under <a href=\"${licenseURL}\">LGPL 3</a>"

    destinationDir = file('docs/')

    options
    {
        addStringOption('Xdoclint:-missing', '-quiet')
        memberLevel = JavadocMemberLevel.PUBLIC
        header = "v${project.version}"
        bottom = "${footer}"
    }
}

jar
{
    metaInf
    {
        from (project.rootDir)
        {
            include 'LICENSE.md'
        }
    }
}

repositories
{
    mavenCentral()
}

dependencies
{
    final String junitVersion  = "5.8.1"
    final String lombokVersion = "1.18.48"

    compileOnly             "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor     "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly         "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation      "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation      "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly         "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly         "org.junit.platform:junit-platform-launcher"
}

tasks.register('generateLargeTextFileForTests')
{
    description = 'Generates a 2GB text file for tests'

    final File outputFile = file("${rootProject.projectDir}/test-data/large-text-file.txt")

    if (!outputFile.exists())
    {
        final String loremIpsumParagraph = 'Lorem ipsum dolor sit amet consectetur adipiscing elit. Quisque faucibus ex sapien vitae pellentesque sem placerat. In id cursus mi pretium tellus duis convallis. Tempus leo eu aenean sed diam urna tempor. Pulvinar vivamus fringilla lacus nec metus bibendum egestas. Iaculis massa nisl malesuada lacinia integer nunc posuere. Ut hendrerit semper vel class aptent taciti sociosqu. Ad litora torquent per conubia nostra inceptos himenaeos.'

        outputFile.parentFile.mkdirs()

        int remaining = Integer.MAX_VALUE

        outputFile.withWriter('UTF-8') { writer ->
            while (remaining > 0)
            {
                final int count = (int) Math.min(remaining, loremIpsumParagraph.length())
                writer.write(loremIpsumParagraph, 0, count)
                remaining -= count
            }
        }

        final String numberOfGigabytesWritten = String.format("%.2f", outputFile.length() / 1073741824)

        println "Created a ${outputFile}. ${numberOfGigabytesWritten} gigabytes written"
    }

    else
    {
        println "File ${outputFile} exists. Skipping generation"
    }
}

test
{
    useJUnitPlatform()

    testLogging
    {
        events 'passed', 'skipped', 'failed'
    }
}

clean
{
    delete 'docs/', 'bin/', '.settings/', '.classpath', '.project', '.factorypath'
}

apply from: 'gradle/format.gradle'

sourceSets
{
    examples
    {
        java
        {
            srcDirs = ['examples/']
        }

        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

tasks.withType(JavaCompile).configureEach
{
    // Silence Lombok warning: "A terminally deprecated method in sun.misc.Unsafe has been called"
    options.forkOptions.jvmArgs << '--sun-misc-unsafe-memory-access=allow'
}

test.dependsOn  'generateLargeTextFileForTests'
build.dependsOn 'javadoc'
